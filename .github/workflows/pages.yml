name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une référence = une file. Un commit plus récent annule le déploiement encore
# en attente de la même branche, sans qu'une pull request puisse annuler `main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Installer les dépendances Python
        run: pip install -r requirements-dev.txt
      - name: Installer les dépendances Node
        run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tester le site
        run: npm test

  package:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    # `configure-pages` interroge l'API Pages : sans `pages: read` elle répond 403.
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Préparer le commit testé
        shell: bash
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          grep -q "__BUILD_VERSION__" _site/sw.js
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/sw.js
          ! grep -q "__BUILD_VERSION__" _site/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
