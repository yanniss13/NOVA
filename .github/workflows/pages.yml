name: Tests et déploiement GitHub Pages

on:
  # Les tests tournent sur TOUTE branche poussee : une regression trouvee sur
  # une branche de fonctionnalite coute une minute, la meme regression trouvee
  # apres fusion coute une enquete. Le deploiement, lui, reste reserve a `main`
  # par la condition des jobs `package` et `deploy`.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une référence = une file. Un commit plus récent annule le déploiement encore
# en attente de la même branche, sans qu'une pull request puisse annuler `main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Installer les dépendances Python
        run: pip install -r requirements-dev.txt
      - name: Installer les dépendances Node
        run: npm ci
      # Sans ce cache, chaque execution retelechargeait Chromium, ~170 Mo.
      # Mesure sur cinq runs consecutifs : 22 s, 32 s, 77 s, 339 s, 1806 s.
      # La derniere a mange les 30 minutes du job, qui a ete annule avant
      # d'avoir lance un seul test. La duree des tests, elle, ne bouge pas :
      # 150 s a trois secondes pres. Le telechargement etait donc le seul
      # facteur, et il ne dependait que du debit d'en face.
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Pas de `--with-deps` : cette option lance un apt-get update qui va
      # chercher les listes de paquets Ubuntu a chaque execution. Mesure du
      # 19 aout : cache du navigateur touche en 3 s, puis 732 s passees dans
      # apt seul, jusqu'a epuiser la borne. L'image ubuntu-latest embarque
      # deja les bibliotheques dont Chromium a besoin.
      #
      # La verification est gratuite et immediate : si une bibliotheque
      # manquait, le premier des seize parcours Playwright echouerait aussitot
      # sur un lancement de navigateur impossible, message parfaitement lisible.
      - name: Installer Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Tester le site
        run: npm test

  package:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    # `configure-pages` interroge l'API Pages : sans `pages: read` elle répond 403.
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Préparer le commit testé
        shell: bash
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          grep -q "__BUILD_VERSION__" _site/sw.js
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/sw.js
          ! grep -q "__BUILD_VERSION__" _site/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
