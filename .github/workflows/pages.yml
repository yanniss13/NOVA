name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Installer les dépendances Node
        run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tester le site
        run: npm test

  package:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Préparer le commit testé
        shell: bash
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          grep -q "__BUILD_VERSION__" _site/sw.js
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/sw.js
          ! grep -q "__BUILD_VERSION__" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: package
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
