name: Rappel Discord — Boss de Guilde

# Relance sur Discord les membres qui n'ont rejoint aucun groupe de la semaine.
# Le boss de confrérie reset le LUNDI 9h -> rappel chaque DIMANCHE (Paris).
#
# UN SEUL cron, et le script ne vérifie plus que le JOUR.
#
# La version d'origine visait midi pile avec deux crons (été/hiver), et le
# rappel n'est de ce fait JAMAIS parti : GitHub Actions lance ses crons avec
# 20 à 90 minutes de retard sur les runners partagés, et les quatre exécutions
# des 26 juillet et 2 août 2026 ont toutes vu 13h à Paris.
#
# Ne PAS rajouter de second cron sans verrou par semaine : la fenêtre couvrant
# désormais tout le dimanche, deux déclenchements posteraient deux messages.
#
# 2 secrets requis (Settings -> Secrets and variables -> Actions) :
#   SUPABASE_SERVICE_ROLE : clé "service_role" Supabase (secrète)
#   DISCORD_WEBHOOK_URL   : URL du webhook de ton salon Discord

on:
  schedule:
    - cron: "0 10 * * 0"   # dimanche 10:00 UTC (11h Paris l'hiver, 12h l'été)
  workflow_dispatch:        # + bouton "Run workflow" manuel (ignore la fenêtre)
    inputs:
      message:
        description: >
          Texte de vérification. Rempli, il est posté tel quel sur Discord
          SANS interroger Supabase — pour tester le webhook après l'avoir
          changé. Laissé vide, le vrai rappel de la semaine est envoyé.
        required: false
        default: ""

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Envoyer le rappel du dimanche
        run: node scripts/discord-reminder.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Lancement manuel -> on force l'envoi (ignore la fenêtre du dimanche).
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # Rempli -> simple vérification du webhook, sans toucher Supabase.
          TEST_MESSAGE: ${{ inputs.message }}
